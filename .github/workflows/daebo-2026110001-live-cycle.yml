name: "Daebo HausD (2026110001) — LIVE win-probability cycle"

# Runs klpga.neo_win.sg_live_v1 (scripts/306 collect + 307 build) on a
# GitHub-hosted runner, which has real internet access to klpga.co.kr --
# unlike Claude's own sandbox (see START_TOURNAMENT.md). This is a
# REFERENCE_ESTIMATE model (see sg_live_v1.py's own docstring) -- it has
# NOT been through the independent Red Team review a "VALIDATED" live
# probability model requires. Every run's output carries its own
# seed, collected_at, and model_status so it stays fully auditable.
#
# Output is pushed to a dedicated `live/2026110001` branch (same
# "latest snapshot only" force-push pattern as neo-sync.yml's
# reader/<gameCode> branches) -- NOT merged into neo-website-v2's own
# history. The live page's client-side JS fetches this branch's
# DAEBO_2026110001_LIVE_PROBABILITY_LATEST.json directly from
# raw.githubusercontent.com, so the displayed numbers refresh without
# any GitHub Pages redeploy.
#
# Safe by construction: cron fires broadly across the three real
# tournament days in UTC (to sidestep the UTC/KST day-boundary
# mismatch), but the job's own first step computes the real KST time
# and SKIPS (zero HTTP calls, zero commits) outside a generous
# 06:00-19:00 KST play window or outside round 1-3's real KST dates.

on:
  workflow_dispatch:
    inputs:
      round:
        description: "Override the auto-detected round (1-3). Leave empty to auto-detect from the current KST date."
        required: false
      seed:
        description: "Override the RNG seed. Leave empty to use this run's own github.run_id (still persisted in the output either way)."
        required: false
  schedule:
    # Every 30 minutes, day-of-month 5-8 of November (UTC) -- covers
    # every real KST moment of 2026-11-06..11-08 despite the UTC/KST
    # offset; see "Safe by construction" above for why day 5 is
    # included and why the job can still skip safely outside real play.
    - cron: "*/30 * 5-8 11 *"

permissions:
  contents: write

jobs:
  live-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: klpga_pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute KST time + round, decide whether to run
        id: decide
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime
          now_utc = datetime.datetime.now(datetime.timezone.utc)
          kst = now_utc + datetime.timedelta(hours=9)
          start = datetime.date(2026, 11, 6)
          round_number = (kst.date() - start).days + 1
          in_window = 6 <= kst.hour < 19
          should_run = in_window and 1 <= round_number <= 3
          print(f"kst_iso={kst.isoformat()}")
          print(f"round_number={round_number}")
          print(f"should_run={'true' if should_run else 'false'}")
          PY

      - name: Set up Python
        if: ${{ steps.decide.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: ${{ steps.decide.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml tenacity

      - name: Resolve round + seed for this run
        id: resolve
        if: ${{ steps.decide.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          ROUND="${{ inputs.round }}"
          if [ -z "$ROUND" ]; then ROUND="${{ steps.decide.outputs.round_number }}"; fi
          SEED="${{ inputs.seed }}"
          if [ -z "$SEED" ]; then SEED="${{ github.run_id }}"; fi
          echo "round=$ROUND" >> "$GITHUB_OUTPUT"
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"

      - name: Collect live round snapshot
        id: collect
        if: ${{ steps.decide.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/klpga_pipeline/src
        run: |
          set +e
          python scripts/306_collect_live_round_snapshot.py --game-code 2026110001 --round "${{ steps.resolve.outputs.round }}" --live
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Build live probability
        id: build
        if: ${{ steps.collect.outputs.exit_code == '0' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/klpga_pipeline/src
        run: |
          set +e
          python scripts/307_build_live_probability.py --current-round "${{ steps.resolve.outputs.round }}" --seed "${{ steps.resolve.outputs.seed }}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Publish to live/2026110001 (force push -- latest snapshot only)
        if: ${{ steps.build.outputs.exit_code == '0' }}
        run: |
          git config user.name "neo-live-cycle-bot"
          git config user.email "neo-live-cycle-bot@users.noreply.github.com"
          git add content/website_v2/2026110001_LIVE_R*_SNAPSHOT.json
          git add content/website_v2/DAEBO_2026110001_LIVE_PROBABILITY_R*_V1.json
          git add content/website_v2/DAEBO_2026110001_LIVE_PROBABILITY_LATEST.json
          git commit -m "Live cycle: round ${{ steps.resolve.outputs.round }}, run ${{ github.run_id }}" || echo "nothing to commit"
          git push --force origin "HEAD:live/2026110001"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Daebo live cycle"
            echo "- should_run (schedule gate): ${{ steps.decide.outputs.should_run }}"
            echo "- kst_iso: ${{ steps.decide.outputs.kst_iso }}"
            echo "- resolved round: ${{ steps.resolve.outputs.round }}"
            echo "- resolved seed: ${{ steps.resolve.outputs.seed }}"
            echo "- collect exit_code: ${{ steps.collect.outputs.exit_code }}"
            echo "- build exit_code: ${{ steps.build.outputs.exit_code }}"
          } >> "$GITHUB_STEP_SUMMARY"

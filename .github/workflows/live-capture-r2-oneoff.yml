name: "LIVE capture -- neogolfdata.com (on-demand, one-off, Desktop+Mobile)"

# Manually dispatched only. Opens the REAL, already-deployed live site
# in a real Chromium on this runner (which has real internet access,
# unlike the agent sandbox) and screenshots exactly what a human sees,
# at both a Desktop and a Mobile viewport. Commits output to a
# separate orphan branch (live-capture-output) so this never touches
# neo-website-v2's or main's own tree/history.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to capture"
        required: false
        default: "https://neogolfdata.com/"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Capture live page (real browser, real network, Desktop + Mobile)
        env:
          CAPTURE_URL: ${{ github.event.inputs.url }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          from playwright.sync_api import sync_playwright

          url = os.environ.get("CAPTURE_URL") or "https://neogolfdata.com/"
          out = pathlib.Path("live_capture")
          out.mkdir(exist_ok=True)

          VIEWPORTS = {
              "desktop": {"width": 1440, "height": 900},
              "mobile": {"width": 390, "height": 844},
          }

          results = {"requested_url": url, "viewports": {}}

          with sync_playwright() as p:
              browser = p.chromium.launch()
              for label, viewport in VIEWPORTS.items():
                  is_mobile = label == "mobile"
                  page = browser.new_page(
                      viewport=viewport,
                      user_agent=(
                          "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) "
                          "AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 "
                          "Mobile/15E148 Safari/604.1"
                      ) if is_mobile else None,
                      is_mobile=is_mobile,
                  )
                  console_errors = []
                  page.on("console", lambda m: console_errors.append(m.text) if m.type == "error" else None)

                  resp = page.goto(url, wait_until="networkidle", timeout=30000)
                  entry = {
                      "final_url": page.url,
                      "http_status": resp.status if resp else None,
                      "title": page.title(),
                      "viewport": viewport,
                  }

                  # top of page (first fold, exactly what a human sees on load)
                  page.evaluate("window.scrollTo(0, 0)")
                  page.screenshot(path=str(out / f"{label}_1_top.png"))

                  # full page (entire scrollable content in one image)
                  page.screenshot(path=str(out / f"{label}_2_full.png"), full_page=True)

                  entry["console_errors"] = console_errors
                  (out / f"{label}_page_source.html").write_text(page.content(), encoding="utf-8")
                  results["viewports"][label] = entry
                  page.close()
              browser.close()

          (out / "meta.json").write_text(
              json.dumps(results, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(results, ensure_ascii=False, indent=2))
          PY

      - name: Publish to dedicated orphan branch (never touches app content)
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git checkout --orphan live-capture-output
          git rm -rf --cached . > /dev/null
          mkdir -p __out
          mv live_capture/* __out/
          git add __out
          git commit -m "LIVE capture: neogolfdata.com Desktop+Mobile ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push -f origin live-capture-output

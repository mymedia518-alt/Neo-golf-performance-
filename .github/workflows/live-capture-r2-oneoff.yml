name: "LIVE capture -- neogolfdata.com (on-demand, one-off, with address bar)"

# Manually dispatched only. Opens the REAL, already-deployed live site
# in a real, non-headless Chromium window under Xvfb on this runner
# (real internet access, unlike the agent sandbox) and takes an
# OS-level screenshot of the whole browser window -- including its own
# address bar, which page.screenshot() can never capture -- at both a
# Desktop and a Mobile-sized window. Also fetches the raw HTTP response
# body of the URL (not the browser's reconstructed DOM) so grep -n
# against it reflects the literal bytes currently being served.
# Commits output to a separate orphan branch (live-capture-output) so
# this never touches neo-website-v2's or main's own tree/history.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to capture"
        required: false
        default: "https://neogolfdata.com/tournaments/2026/2026100005/r2/"
      post_data:
        description: "Optional: application/x-www-form-urlencoded body. When set, the raw-bytes fetch step below sends a POST with this body instead of a GET (needed for KLPGA's own /load/... AJAX endpoints, which are POST-only). Never changes the two Playwright screenshot steps, which always GET the URL as a browser would."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright + Xvfb + scrot
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update -y
          sudo apt-get install -y xvfb scrot

      - name: Fetch raw HTTP response body (exact bytes currently served)
        env:
          CAPTURE_URL: ${{ github.event.inputs.url }}
          CAPTURE_POST_DATA: ${{ github.event.inputs.post_data }}
        run: |
          mkdir -p live_capture
          python - <<'PY'
          import os
          import pathlib
          import urllib.request

          url = os.environ.get("CAPTURE_URL") or "https://neogolfdata.com/tournaments/2026/2026100005/r2/"
          post_data = os.environ.get("CAPTURE_POST_DATA") or ""
          out = pathlib.Path("live_capture")
          out.mkdir(exist_ok=True)

          headers = {"User-Agent": "Mozilla/5.0"}
          data = None
          if post_data:
              data = post_data.encode("utf-8")
              headers["Content-Type"] = "application/x-www-form-urlencoded"
              headers["X-Requested-With"] = "XMLHttpRequest"
          req = urllib.request.Request(url, data=data, headers=headers, method="POST" if data else "GET")
          with urllib.request.urlopen(req, timeout=30) as resp:
              raw = resp.read()
              headers = dict(resp.getheaders())
              status = resp.status

          (out / "live_raw.html").write_bytes(raw)
          (out / "fetch_meta.txt").write_text(
              f"url={url}\nstatus={status}\nheaders={headers}\nbytes={len(raw)}\n",
              encoding="utf-8",
          )
          PY

      - name: grep -n "CUT LINE 87타 이하 통과" on the raw served HTML
        run: |
          mkdir -p live_capture
          echo "=== grep -n result on live_raw.html (the exact bytes fetched above) ===" > live_capture/grep_result.txt
          grep -n "CUT LINE 87타 이하 통과" live_capture/live_raw.html >> live_capture/grep_result.txt || echo "NO MATCH" >> live_capture/grep_result.txt
          echo "" >> live_capture/grep_result.txt
          echo "=== wc -l live_raw.html (total line count in the raw file) ===" >> live_capture/grep_result.txt
          wc -l live_capture/live_raw.html >> live_capture/grep_result.txt
          cat live_capture/grep_result.txt

      - name: Capture real browser window incl. address bar (Desktop)
        env:
          CAPTURE_URL: ${{ github.event.inputs.url }}
        run: |
          mkdir -p live_capture
          xvfb-run -a --server-args="-screen 0 1440x960x24" python - <<'PY'
          import os
          import subprocess
          import time
          from playwright.sync_api import sync_playwright

          url = os.environ.get("CAPTURE_URL") or "https://neogolfdata.com/tournaments/2026/2026100005/r2/"

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=False,
                  args=["--window-size=1440,960", "--window-position=0,0", "--new-window"],
              )
              context = browser.new_context(no_viewport=True)
              page = context.new_page()
              page.goto(url, wait_until="networkidle", timeout=30000)
              time.sleep(1.5)
              subprocess.run(["scrot", "-o", "live_capture/desktop_with_addressbar.png"], check=True)
              browser.close()
          PY

      - name: Capture real browser window incl. address bar (Mobile-width)
        env:
          CAPTURE_URL: ${{ github.event.inputs.url }}
        run: |
          mkdir -p live_capture
          xvfb-run -a --server-args="-screen 0 430x950x24" python - <<'PY'
          import os
          import subprocess
          import time
          from playwright.sync_api import sync_playwright

          url = os.environ.get("CAPTURE_URL") or "https://neogolfdata.com/tournaments/2026/2026100005/r2/"
          mobile_ua = (
              "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) "
              "AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 "
              "Mobile/15E148 Safari/604.1"
          )

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=False,
                  args=["--window-size=430,950", "--window-position=0,0", "--new-window"],
              )
              context = browser.new_context(no_viewport=True, user_agent=mobile_ua)
              page = context.new_page()
              page.goto(url, wait_until="networkidle", timeout=30000)
              time.sleep(1.5)
              subprocess.run(["scrot", "-o", "live_capture/mobile_with_addressbar.png"], check=True)
              browser.close()
          PY

      - name: Publish to dedicated orphan branch (never touches app content)
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git checkout --orphan live-capture-output
          git rm -rf --cached . > /dev/null
          mkdir -p __out
          mv live_capture/* __out/ 2>/dev/null || true
          git add __out
          git commit -m "LIVE capture w/ address bar: neogolfdata.com R2 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push -f origin live-capture-output

name: "NEO Sync — Reader (collect, normalize, warehouse, validate, review, publish)"

# The default, automated tournament-start route -- see START_TOURNAMENT.md.
# Runs klpga.neo_reader (klpga_pipeline/src/klpga/neo_reader/) on a
# GitHub-hosted runner, which has real internet access unlike Claude's
# own sandbox (confirmed blocked: see
# .github/workflows/test-klpga-reachability.yml).
#
# ARCHITECTURE CORRECTION (2026-09-30, found during the first real
# end-to-end run): the original design had Claude consume this job's
# output exclusively via a GitHub Actions Artifact. In practice, the
# Artifact API hands back a short-lived signed URL pointing at Azure
# Blob Storage (productionresultssa14.blob.core.windows.net) -- a host
# outside Claude's own sandbox's network allowlist, confirmed blocked
# the same way klpga.co.kr is. So this job now ALSO runs
# klpga.neo_reader's own git-publish stage (stage 6), pushing to a
# dedicated reader/<gameCode> branch -- git push/pull already proven to
# work from Claude's sandbox throughout this project. The Artifact
# upload stays too, for a human operator who does not have that
# restriction and wants a quick local download.
on:
  workflow_dispatch:
    inputs:
      game_code:
        description: "Official KLPGA gameCode, e.g. 2026100001"
        required: true
      season:
        description: "Season year (optional -- inferred from the gameCode's leading 4 digits if omitted)"
        required: false
      stage:
        description: "'pre' (Tournament Info + Entry List + K-Ranking) or 'results' (adds round leaderboard, only once a round has real data)"
        required: false
        default: "pre"
        type: choice
        options:
          - pre
          - results

permissions:
  contents: write

jobs:
  neo-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: klpga_pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity (needed for stage 6's commit)
        run: |
          git config user.name "neo-sync-bot"
          git config user.email "neo-sync-bot@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml tenacity

      - name: Run NEO Sync (all 6 stages — including git publish)
        id: sync
        env:
          PYTHONPATH: ${{ github.workspace }}/klpga_pipeline/src
        run: |
          SEASON_ARG=""
          if [ -n "${{ inputs.season }}" ]; then
            SEASON_ARG="--season ${{ inputs.season }}"
          fi
          set +e
          python -m klpga.neo_reader.cli sync \
            --game-code "${{ inputs.game_code }}" \
            $SEASON_ARG \
            --stage "${{ inputs.stage }}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Write job summary from the review report
        if: always()
        run: |
          REPORT="reports/${{ inputs.game_code }}/REVIEW_REPORT_V1.md"
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## NEO Sync — no review report was written"
              echo ""
              echo "Sync failed before stage 5 (review report). See the "
              echo "'Run NEO Sync' step's own log output above for the exact"
              echo "stage and error."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Diagnostic dump — raw capture sizes and a snippet of each
        if: always()
        run: |
          GAME_DIR="raw/${{ inputs.game_code }}"
          if [ -d "$GAME_DIR" ]; then
            {
              echo "## Raw captures for ${{ inputs.game_code }}"
              echo ""
              for f in "$GAME_DIR"/*; do
                [ -f "$f" ] || continue
                echo "### $f ($(stat -c%s "$f") bytes)"
                echo '```'
                head -c 800 "$f"
                echo ""
                echo '```'
              done
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sync artifacts (convenience for a human operator)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neo-sync-${{ inputs.game_code }}-${{ github.run_id }}
          path: |
            klpga_pipeline/raw/${{ inputs.game_code }}
            klpga_pipeline/normalized/${{ inputs.game_code }}
            klpga_pipeline/reports/${{ inputs.game_code }}
            klpga_pipeline/content/website_v2/${{ inputs.game_code }}_*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Fail the job if sync did not succeed
        if: steps.sync.outputs.exit_code != '0'
        run: |
          echo "NEO Sync exited with code ${{ steps.sync.outputs.exit_code }} — see the job summary above."
          exit 1

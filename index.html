<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEO Golf Data</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2335D07F'/%3E%3Ctext x='16' y='22' font-size='18' font-family='sans-serif' font-weight='800' text-anchor='middle' fill='%230A0E15'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/css/neo.css">
</head>
<body>
<header data-neo-header></header>

<main class="wrap page">
  <div class="grid-2">
    <section class="card hero-home">
      <span class="eyebrow">NEO Golf Data</span>
      <h1>선수를 순위가 아니라<br>플레이 방식으로 읽는다.</h1>
      <p>선수 이름을 클릭하면 Player Intelligence가 열린다. 프로필이 아니라, 그 선수가 지금 어떤 골프를 하고 있는지 데이터로 설명하는 페이지다.</p>
      <div class="stat-row">
        <div class="stat-tile"><b class="num">6</b><span>Tracked Players</span></div>
        <div class="stat-tile"><b class="num">5</b><span>DNA Axis</span></div>
        <div class="stat-tile"><b class="num">1,284</b><span>Shots Logged</span></div>
      </div>
    </section>
    <section class="card card--pad">
      <div class="page-head" style="margin-bottom:12px">
        <div><h2 class="section-title">Live Leaderboard</h2>
        <p class="section-sub" data-tour-sub></p></div>
      </div>
      <div data-leaderboard-mini></div>
    </section>
  </div>

  <section class="card card--pad" style="margin-top:20px">
    <h2 class="section-title">NEO Ranking</h2>
    <p class="section-sub">NEO 지표 기준 · 선수 이름 클릭 → Player Intelligence</p>
    <div style="margin-top:12px" data-ranking></div>
  </section>
</main>

<script src="/assets/js/data.js"></script>
<script src="/assets/js/neo.js"></script>
<script>
  NEOUI.header("home");
  document.querySelector("[data-tour-sub]").textContent = NEO.tournament.name + " · " + NEO.tournament.round;
  NEOUI.leaderboardTable(document.querySelector("[data-leaderboard-mini]"), 6);
  NEOUI.rankingTable(document.querySelector("[data-ranking]"));
</script>
</body>
</html>

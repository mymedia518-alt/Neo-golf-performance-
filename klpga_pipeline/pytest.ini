[pytest]
markers =
    round_pipeline: tests exercising the HITE JINRO (2026100005) round-agnostic pipeline (klpga.neo_win.hitejinro_round_pipeline / hitejinro_round_page / hitejinro_player_metrics, scripts/run_round_pipeline.py, scripts/190-203) and the shared modules it depends on (previous_tournament_link, home ownership/stage promotion, player_intelligence_generator, round_score_format). Run with: python -m pytest -m round_pipeline. Added 2026-10-01 so a run_round_pipeline.py change doesn't require the full ~377-file suite every time -- that full suite stays reserved for pre-main-merge, pre-FR-deploy, structural refactors, and shared-library changes (see klpga_pipeline/tests/README_TARGETED_REGRESSION.md).

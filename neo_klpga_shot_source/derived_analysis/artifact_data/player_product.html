<title>코스 매니지먼트 카드</title>
<style>
/* Layout: 1-page scannable product — header selector, then
   strategy-card (headline) -> map -> risk tiers -> evidence (collapsed)
   -> detail (collapsed). Palette: paper/fairway, like a tour yardage
   book. Display: Oswald (condensed, confident, leaderboard-like). Body:
   Inter. Data/distances: IBM Plex Mono, tabular. */
:root{
  --bg:#f6f4ec; --surface:#ffffff; --surface-2:#edeadf; --border:#d9d3bf;
  --fg:#1b2420; --fg-muted:#5c6a5e; --accent:#2f6b4f; --accent-bg:#e1ede6;
  --ideal:#2f7a4f; --ideal-bg:#e3f1e8;
  --acceptable:#b8842a; --acceptable-bg:#f6ecd8;
  --damage:#b05a22; --damage-bg:#f7e6d8;
  --nogo:#a3362b; --nogo-bg:#f6dedb;
  --field:#5c6a5e; --field-bg:#eceee4;
  --p9115:#1d5fb8; --p9708:#7b3fb0; --p9111:#c05a1e;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --disp:'Oswald',sans-serif; --body:'Inter',sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141814; --surface:#1c211c; --surface-2:#242a23; --border:#363d34;
    --fg:#ecefe9; --fg-muted:#9aa89d; --accent:#52b388; --accent-bg:#1c3328;
    --ideal:#52b388; --ideal-bg:#17301f;
    --acceptable:#d9a94c; --acceptable-bg:#352b16;
    --damage:#e08a52; --damage-bg:#3a2516;
    --nogo:#e2695d; --nogo-bg:#3c2320;
    --field:#9aa89d; --field-bg:#242a23;
    --p9115:#5c9bf0; --p9708:#b486e6; --p9111:#f0924f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141814; --surface:#1c211c; --surface-2:#242a23; --border:#363d34;
  --fg:#ecefe9; --fg-muted:#9aa89d; --accent:#52b388; --accent-bg:#1c3328;
  --ideal:#52b388; --ideal-bg:#17301f;
  --acceptable:#d9a94c; --acceptable-bg:#352b16;
  --damage:#e08a52; --damage-bg:#3a2516;
  --nogo:#e2695d; --nogo-bg:#3c2320;
  --field:#9aa89d; --field-bg:#242a23;
  --p9115:#5c9bf0; --p9708:#b486e6; --p9111:#f0924f;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0;padding-inline:16px;padding-block:18px 48px}
.wrap{max-width:920px;margin:0 auto}
h1{font-family:var(--disp);font-weight:600;font-size:clamp(20px,5vw,28px);letter-spacing:.2px;margin:0 0 2px;text-wrap:balance}
.sub{color:var(--fg-muted);font-size:13px;margin:0 0 16px}
.section-title{font-family:var(--disp);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-muted);margin:22px 0 10px}

/* selector */
.selector-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:6px;z-index:20}
.seg{display:flex;gap:2px;background:var(--surface-2);border-radius:10px;padding:3px;border:1px solid var(--border)}
.seg button{font-family:var(--body);font-weight:600;font-size:13px;padding:8px 14px;border:none;border-radius:7px;background:transparent;color:var(--fg-muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.player-btn[aria-pressed="true"]{color:#fff}
.seg button.p-9115[aria-pressed="true"]{background:var(--p9115)}
.seg button.p-9708[aria-pressed="true"]{background:var(--p9708)}
.seg button.p-9111[aria-pressed="true"]{background:var(--p9111)}

/* strategy card */
.strategy-card{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:18px 20px;margin-bottom:18px}
.strategy-headline{font-family:var(--disp);font-size:clamp(16px,4vw,20px);font-weight:600;line-height:1.35;margin:0 0 14px;color:var(--accent)}
.strategy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 18px}
.strategy-item{border-top:1px solid var(--border);padding-top:8px}
.strategy-item .label{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-muted);display:block;margin-bottom:3px}
.strategy-item .value{font-size:14px;line-height:1.5}
.strategy-item .value b{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* map */
.map-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:16px}
.map-stage{position:relative;width:100%;border-radius:10px;overflow:hidden;background:#232c22}
.map-stage img{display:block;width:100%;height:auto}
.map-stage svg{position:absolute;inset:0;width:100%;height:100%}
.map-legend{display:flex;flex-wrap:wrap;gap:12px 16px;margin-top:12px;font-size:11.5px;color:var(--fg-muted)}
.map-legend .item{display:flex;align-items:center;gap:6px}
.leg-shape{width:14px;height:14px;flex:none;display:inline-block}

/* 4-tier */
.tier-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:18px}
.tier-card{border-radius:12px;padding:13px 14px;border:1.5px solid}
.tier-card.ideal{background:var(--ideal-bg);border-color:var(--ideal)}
.tier-card.acceptable{background:var(--acceptable-bg);border-color:var(--acceptable)}
.tier-card.damage{background:var(--damage-bg);border-color:var(--damage)}
.tier-card.nogo{background:var(--nogo-bg);border-color:var(--nogo)}
.tier-label{font-family:var(--disp);font-size:12px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;margin-bottom:6px}
.tier-card.ideal .tier-label{color:var(--ideal)}
.tier-card.acceptable .tier-label{color:var(--acceptable)}
.tier-card.damage .tier-label{color:var(--damage)}
.tier-card.nogo .tier-label{color:var(--nogo)}
.tier-text{font-size:13px;line-height:1.5}

/* badges distinguishing FIELD/PLAYER layers */
.layer-badge{font-family:var(--mono);font-size:10px;letter-spacing:.04em;padding:3px 8px;border-radius:999px;border:1px solid;display:inline-block;margin-bottom:8px}
.layer-badge.field{color:var(--field);border-color:var(--field);background:var(--field-bg)}
.layer-badge.player-obs{color:var(--fg);border-color:var(--border);background:var(--surface-2)}
.layer-badge.player-rec{color:var(--accent);border-color:var(--accent);background:var(--accent-bg)}

details{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden}
details summary{font-family:var(--disp);font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-muted);padding:13px 16px;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between}
details summary::-webkit-details-marker{display:none}
details summary::after{content:'+';font-size:16px}
details[open] summary::after{content:'\2212'}
details .inner{padding:0 16px 16px}

.chain-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.chain-table th,.chain-table td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:left}
.chain-table th{color:var(--fg-muted);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.chain-table td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chain-table tr{cursor:pointer}
.chain-table tr:hover td{background:var(--surface-2)}
.score-chip{display:inline-block;padding:2px 7px;border-radius:999px;font-family:var(--mono);font-size:11px;font-weight:600}
.score-chip.under{background:var(--ideal-bg);color:var(--ideal)}
.score-chip.par{background:var(--field-bg);color:var(--field)}
.score-chip.bogey{background:var(--acceptable-bg);color:var(--acceptable)}
.score-chip.double{background:var(--nogo-bg);color:var(--nogo)}

.field-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.field-stat{border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12.5px}
.field-stat .ft{font-weight:600;margin-bottom:3px}
.field-stat.worst{border-color:var(--nogo)}
.field-stat.best{border-color:var(--ideal)}

.shot-popup{position:fixed;display:none;z-index:50;width:min(280px,calc(100vw - 32px));background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:12.5px}
.shot-popup .sp-close{position:absolute;top:6px;right:10px;cursor:pointer;color:var(--fg-muted);font-size:16px}
.shot-popup .sp-title{font-family:var(--disp);font-weight:600;font-size:14px;margin-bottom:8px}
.shot-popup .sp-row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:var(--fg-muted)}
.shot-popup .sp-row b{color:var(--fg);font-family:var(--mono)}

.actual-note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--fg-muted);margin-top:10px;line-height:1.5}
.actual-note b{color:var(--fg)}

@media (max-width: 480px){
  .strategy-grid{grid-template-columns:1fr}
  .field-stat-grid{grid-template-columns:1fr}
}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">

<div class="wrap">
  <h1 id="pageTitle">코스 매니지먼트 카드</h1>
  <p class="sub">하이트진로 챔피언십 2026 &middot; Blue Heron &middot; 실제 Shot Tracker 데이터 기반</p>

  <div class="selector-row">
    <div class="seg" id="playerSeg"></div>
    <div class="seg" id="holeSeg"></div>
  </div>

  <div class="strategy-card">
    <div class="strategy-headline" id="headline"></div>
    <div class="strategy-grid" id="strategyGrid"></div>
  </div>

  <div class="section-title">코스 지도</div>
  <div class="map-card">
    <div class="map-stage">
      <img id="holeImg" alt="hole map">
      <svg id="mapSvg" viewBox="0 0 650 433" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="map-legend" id="mapLegend"></div>
  </div>

  <div class="section-title">상황별 대응</div>
  <div class="tier-grid" id="tierGrid"></div>

  <div id="actualNoteWrap"></div>

  <details id="evidenceDetails">
    <summary>실제 근거 보기 — 라운드별 실제 기록</summary>
    <div class="inner">
      <span class="layer-badge field">FIELD OBSERVED</span>
      <div class="field-stat-grid" id="fieldStats"></div>
      <div style="height:14px"></div>
      <span class="layer-badge player-obs">PLAYER OBSERVED — 실제 4라운드</span>
      <table class="chain-table" id="chainTable"></table>
      <div style="height:10px"></div>
      <span class="layer-badge player-rec">PLAYER RECOMMENDATION</span>
      <div class="actual-note" id="recNote"></div>
    </div>
  </details>

  <details id="detailDetails">
    <summary>세부 데이터</summary>
    <div class="inner" id="detailInner" style="font-family:var(--mono);font-size:11.5px;line-height:1.8;color:var(--fg-muted)"></div>
  </details>
</div>

<script>
const DATA = JSON.parse(document.getElementById('PRODUCT_DATA').textContent);
let activePlayer = '9115';
let activeHole = 'hole12';

const SCORE_LABEL_KO = {0: '파', '-1':'버디+', 1:'보기', 2:'더블+'};
function scoreChip(stp){
  if(stp <= -1) return '<span class="score-chip under">버디+</span>';
  if(stp === 0) return '<span class="score-chip par">파</span>';
  if(stp === 1) return '<span class="score-chip bogey">보기</span>';
  return '<span class="score-chip double">더블+</span>';
}
const LIE_KO = {'FAIRWAY':'페어웨이','ROUGH':'러프','GREEN':'그린','BUNKER':'벙커','FRINGE':'프린지','GREENSIDE_BUNKER':'그린사이드 벙커','OB':'OB','PENALTY_AREA':'페널티구역','LOST_BALL':'분실구','PENALTY_STROKE':'벌타','HOLED':'홀인'};
function lieKo(s){ return LIE_KO[s] || s; }

function svgEl(tag, attrs){
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function renderSelectors(){
  const pSeg = document.getElementById('playerSeg');
  pSeg.innerHTML = '';
  for(const pc in DATA.players){
    const btn = document.createElement('button');
    btn.className = 'player-btn p-' + pc;
    btn.setAttribute('aria-pressed', activePlayer === pc);
    btn.textContent = DATA.players[pc];
    btn.onclick = () => { activePlayer = pc; renderAll(); };
    pSeg.appendChild(btn);
  }
  const hSeg = document.getElementById('holeSeg');
  hSeg.innerHTML = '';
  [['hole1','Hole 1'], ['hole12','Hole 12']].forEach(([key,label])=>{
    const btn = document.createElement('button');
    btn.setAttribute('aria-pressed', activeHole === key);
    btn.textContent = label;
    btn.onclick = () => { activeHole = key; renderAll(); };
    hSeg.appendChild(btn);
  });
}

function renderStrategyCard(c){
  document.getElementById('headline').textContent = c.headline;
  const items = [
    ['보낼 거리', c.send_distance],
    ['허용 위치', c.allowed],
    ['피해야 할 위치', c.avoid],
    ['남길 다음 거리', c.next_distance],
    ['실수했을 때 우선순위', c.miss_priority],
    ['큰 숫자가 시작되는 조건', c.big_number_trigger],
  ];
  document.getElementById('strategyGrid').innerHTML = items.map(([l,v])=>`
    <div class="strategy-item"><span class="label">${l}</span><div class="value">${v}</div></div>
  `).join('');
}

function renderMap(hole, c){
  const geom = DATA.geom[hole];
  const zoneHuman = DATA.zone_human[hole];
  const field = DATA.field[hole];
  document.getElementById('holeImg').src = geom.image;
  const svg = document.getElementById('mapSvg');
  svg.innerHTML = '';

  // field worst/best (neutral square markers)
  [[field.worst_zone,'nogo','field-worst','위험(필드 관찰)'], [field.best_zone,'ideal','field-best','양호(필드 관찰)']].forEach(([zoneKey, cls, id, label])=>{
    const [cx,cy] = geom.zone_centers[zoneKey];
    const color = cls==='nogo' ? 'var(--nogo)' : 'var(--ideal)';
    const rect = svgEl('rect', {x:cx-9, y:cy-9, width:18, height:18, fill:'none', stroke:color, 'stroke-width':2, 'stroke-dasharray':'3 2', transform:`rotate(45 ${cx} ${cy})`});
    svg.appendChild(rect);
  });

  // player no-go zones (hatched triangle)
  (c.nogo_zones||[]).forEach(zoneKey=>{
    const [cx,cy] = geom.zone_centers[zoneKey];
    const tri = svgEl('polygon', {points:`${cx},${cy-13} ${cx-12},${cy+9} ${cx+12},${cy+9}`, fill:'var(--nogo)', opacity:'0.85', stroke:'#fff', 'stroke-width':1.5});
    svg.appendChild(tri);
    const t = svgEl('text', {x:cx, y:cy+26, 'text-anchor':'middle','font-size':'9','font-family':'IBM Plex Mono, monospace',fill:'#fff','font-weight':'700', style:'paint-order:stroke;stroke:#000;stroke-width:3px'});
    t.textContent = '피해야 할 구역';
    svg.appendChild(t);
  });

  // player acceptable zones (dashed diamond outline)
  (c.acceptable_zones||[]).forEach(zoneKey=>{
    const [cx,cy] = geom.zone_centers[zoneKey];
    const d = svgEl('polygon', {points:`${cx},${cy-11} ${cx+11},${cy} ${cx},${cy+11} ${cx-11},${cy}`, fill:'none', stroke:'var(--acceptable)', 'stroke-width':2.2, 'stroke-dasharray':'4 3'});
    svg.appendChild(d);
  });

  // player primary/recommended zones (solid filled circle, largest)
  (c.primary_zones||[]).forEach(zoneKey=>{
    const [cx,cy] = geom.zone_centers[zoneKey];
    const circ = svgEl('circle', {cx, cy, r:14, fill:'var(--accent)', opacity:'0.3', stroke:'var(--accent)', 'stroke-width':2.5});
    svg.appendChild(circ);
    const inner = svgEl('circle', {cx, cy, r:4, fill:'var(--accent)'});
    svg.appendChild(inner);
  });

  // tee + green anchors: small hollow rings only (no floating text labels,
  // legend explains them) -- drawn AFTER player dots below via a deferred
  // node so they never get buried under a real landing marker.
  const teeMarker = svgEl('circle', {cx:geom.tee.px, cy:geom.tee.py, r:5, fill:'none', stroke:'#fff', 'stroke-width':2.5});
  const teeMarker2 = svgEl('circle', {cx:geom.tee.px, cy:geom.tee.py, r:5, fill:'none', stroke:'#232c22', 'stroke-width':1});
  const greenMarker = svgEl('circle', {cx:geom.green.px, cy:geom.green.py, r:5, fill:'#fff', stroke:'#232c22', 'stroke-width':2});

  // field-wide faint dots
  const shots = DATA.shots[hole];
  const fieldG = svgEl('g', {opacity:'0.35'});
  shots.forEach(s=>{
    if(s.pc === activePlayer) return;
    fieldG.appendChild(svgEl('circle', {cx:s.px, cy:s.py, r:2, fill:'#9ca39c'}));
  });
  svg.appendChild(fieldG);

  // this player's actual real landings (PLAYER OBSERVED). Real rounds can
  // land within a few px of each other; spread overlapping markers along a
  // small circle around their true centroid so every round stays clickable
  // and readable (position is visually nudged only when points coincide --
  // the real coordinates are still what the click popup reports).
  const info = DATA.players;
  const playerColor = `var(--p${activePlayer})`;
  const playerShots = shots.filter(s=>s.pc===activePlayer);
  const placed = [];
  playerShots.forEach(s=>{
    let cx = s.px, cy = s.py;
    let tries = 0;
    while(placed.some(p => Math.hypot(p.cx-cx, p.cy-cy) < 15) && tries < 8){
      const ang = tries * (Math.PI * 2 / 6);
      cx = s.px + Math.cos(ang) * 11;
      cy = s.py + Math.sin(ang) * 11;
      tries++;
    }
    placed.push({cx, cy});
    if(cx !== s.px || cy !== s.py){
      svg.appendChild(svgEl('line', {x1:s.px, y1:s.py, x2:cx, y2:cy, stroke:playerColor, 'stroke-width':1, opacity:'0.6'}));
    }
    const dot = svgEl('circle', {cx, cy, r:7, fill:playerColor, stroke:'#fff', 'stroke-width':1.8, style:'cursor:pointer'});
    dot.addEventListener('click', (e)=>{ e.stopPropagation(); showShotDetail(s, e); });
    svg.appendChild(dot);
    const t = svgEl('text', {x:cx, y:cy+3, 'text-anchor':'middle','font-size':'8','font-family':'IBM Plex Mono, monospace',fill:'#fff','font-weight':'700', style:'pointer-events:none'});
    t.textContent = 'R'+s.rnd;
    svg.appendChild(t);
  });

  // tee/green rings drawn last so they stay visible even when a real
  // landing marker sits nearby (fixes a real overlap found in visual QA).
  svg.appendChild(teeMarker);
  svg.appendChild(teeMarker2);
  svg.appendChild(greenMarker);

  document.getElementById('mapLegend').innerHTML = `
    <span class="item"><span class="leg-shape" style="border-radius:50%;border:2.5px solid #5c6a5e"></span>티 구역(근사치)</span>
    <span class="item"><span class="leg-shape" style="border-radius:50%;background:#fff;border:2px solid #232c22"></span>그린</span>
    <span class="item"><span class="leg-shape" style="border-radius:50%;background:var(--accent);opacity:.5;border:2px solid var(--accent)"></span>선수 추천 코리도</span>
    <span class="item"><span class="leg-shape" style="background:none;border:2px dashed var(--acceptable);transform:rotate(45deg)"></span>허용 가능 위치</span>
    <span class="item"><span class="leg-shape" style="background:var(--nogo);clip-path:polygon(50% 0,0 100%,100% 100%)"></span>피해야 할 위치</span>
    <span class="item"><span class="leg-shape" style="background:none;border:2px dashed var(--ideal);transform:rotate(45deg)"></span>필드 관찰 양호 구역</span>
    <span class="item"><span class="leg-shape" style="background:none;border:2px dashed var(--nogo);transform:rotate(45deg)"></span>필드 관찰 위험 구역</span>
    <span class="item"><span class="leg-shape" style="border-radius:50%;background:${playerColor}"></span>${info[activePlayer]} 실제 착지(4라운드)</span>
    <span class="item"><span class="leg-shape" style="border-radius:50%;background:#9ca39c;opacity:.5"></span>전체 필드 실제 티샷</span>
  `;
}

function showShotDetail(s, evt){
  let pop = document.getElementById('shotDetailPopup');
  if(!pop){ pop = document.createElement('div'); pop.id='shotDetailPopup'; pop.className='shot-popup'; document.body.appendChild(pop); }
  const approachResult = s.gir ? 'GIR (그린 적중)' : ('미스 — ' + lieKo(s.alie));
  pop.innerHTML = `
    <div class="sp-close" onclick="document.getElementById('shotDetailPopup').style.display='none'">&times;</div>
    <div class="sp-title">${s.nm} <span style="font-family:var(--mono);font-size:11px;color:var(--fg-muted)">R${s.rnd}</span></div>
    <div class="sp-row"><span>티샷 거리</span><b>${s.land.toFixed(1)}yd</b></div>
    <div class="sp-row"><span>착지 라이</span><b>${lieKo(s.tlie)}</b></div>
    <div class="sp-row"><span>핀까지 남은거리</span><b>${s.app.toFixed(1)}yd</b></div>
    <div class="sp-row"><span>어프로치 결과</span><b>${approachResult}</b></div>
    <div class="sp-row"><span>최종 스코어</span><b>${s.strokes}타 (${s.stp>=0?'+':''}${s.stp})</b></div>
  `;
  pop.style.display = 'block';
  const x = Math.min(evt.clientX + 14, window.innerWidth - 296);
  const y = Math.min(evt.clientY + 14, window.innerHeight - 200);
  pop.style.left = Math.max(16,x) + 'px';
  pop.style.top = Math.max(16,y) + 'px';
}
document.addEventListener('click', ()=>{ const p=document.getElementById('shotDetailPopup'); if(p) p.style.display='none'; });

function renderTiers(c){
  const tiers = [['ideal','IDEAL','완벽한 샷'],['acceptable','ACCEPTABLE','허용 가능'],['damage','DAMAGE CONTROL','손상 관리'],['nogo','NO-GO','절대 회피']];
  document.getElementById('tierGrid').innerHTML = tiers.map(([key,label])=>`
    <div class="tier-card ${key}">
      <div class="tier-label">${label}</div>
      <div class="tier-text">${c.tier[key.replace('damage','damage_control')] || c.tier[key]}</div>
    </div>
  `).join('');
}

function renderEvidence(hole, pc, c){
  const field = DATA.field[hole];
  document.getElementById('fieldStats').innerHTML = `
    <div class="field-stat best"><div class="ft" style="color:var(--ideal)">관찰상 양호: ${field.best_label}</div>${field.best_stat}</div>
    <div class="field-stat worst"><div class="ft" style="color:var(--nogo)">관찰상 위험: ${field.worst_label}</div>${field.worst_stat}</div>
  `;
  const pdata = DATA.player_data[pc][hole];
  const rounds = pdata.four_rounds;
  const rows = rounds.map(r=>`
    <tr onclick='showShotDetail(${JSON.stringify({nm:DATA.players[pc], rnd:r.round, land:r.landing_distance_yd, tlie:r.tee_lie, app:r.approach_distance_yd, alie:r.approach_lie, gir:r.gir, strokes:r.strokes, stp:r.score_to_par})}, event)'>
      <td class="num">R${r.round}</td>
      <td class="num">${r.landing_distance_yd.toFixed(0)}yd</td>
      <td>${lieKo(r.tee_lie)}</td>
      <td class="num">${r.approach_distance_yd.toFixed(0)}yd</td>
      <td>${lieKo(r.approach_lie)}</td>
      <td>${r.gir ? 'GIR' : '미스'}</td>
      <td>${scoreChip(r.score_to_par)}</td>
    </tr>
  `).join('');
  document.getElementById('chainTable').innerHTML = `
    <thead><tr><th>R</th><th>티샷거리</th><th>라이</th><th>남은거리</th><th>어프로치라이</th><th>결과</th><th>스코어</th></tr></thead>
    <tbody>${rows}</tbody>
  `;
  document.getElementById('recNote').innerHTML = (c.actual_zones_note ? c.actual_zones_note + '<br><br>' : '') +
    '추천 코리도: ' + (c.primary_zones||[]).map(z=>DATA.zone_human[hole][z].dist+' · '+DATA.zone_human[hole][z].corridor).join(', ');
}

function renderDetail(hole, pc){
  const pdata = DATA.player_data[pc];
  document.getElementById('detailInner').innerHTML = `
    <div>practice_priority: ${pdata.practice_priority.priority_ko}</div>
    <div style="margin-bottom:8px;color:var(--fg)">${pdata.practice_priority.evidence_ko}</div>
    <div>source: hole1_full_analysis.json / hole12_distance_calibrated_analysis.json / hole12_master_template.json / neo_player_event_shot_metrics.csv</div>
  `;
}

function renderAll(){
  renderSelectors();
  const c = DATA.content[activePlayer][activeHole];
  document.getElementById('pageTitle').textContent = DATA.players[activePlayer] + ' — ' + (activeHole==='hole1'?'Hole 1':'Hole 12') + ' 코스 매니지먼트';
  renderStrategyCard(c);
  renderMap(activeHole, c);
  renderTiers(c);
  renderEvidence(activeHole, activePlayer, c);
  renderDetail(activeHole, activePlayer);
  const noteEl = document.getElementById('actualNoteWrap');
  noteEl.innerHTML = '';
}

renderAll();
</script>
